name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: '8.0'

      - name: Restore
        run: |
          dotnet restore CSharpRPGBackend.sln
          dotnet restore tests/RPGWeb.E2ETests/RPGWeb.E2ETests.csproj

      - name: Build
        run: |
          dotnet build CSharpRPGBackend.sln --configuration Release --no-restore
          dotnet build tests/RPGWeb.E2ETests/RPGWeb.E2ETests.csproj --configuration Release --no-restore

      - name: Run core regression suite
        run: dotnet test tests/CSharpRPGBackend.Tests/CSharpRPGBackend.Tests.csproj --configuration Release --no-build --verbosity minimal

      - name: Install Playwright Chromium
        shell: pwsh
        run: pwsh tests/RPGWeb.E2ETests/bin/Release/net8.0/playwright.ps1 install chromium

      - name: Run browser regression suite
        run: dotnet test tests/RPGWeb.E2ETests/RPGWeb.E2ETests.csproj --configuration Release --no-build --verbosity minimal
